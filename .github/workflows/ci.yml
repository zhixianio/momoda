# 每次 push / PR：跑单测并构建 debug 包
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 同时校验 gradle-wrapper.jar 没被篡改，并缓存 Gradle
      - uses: gradle/actions/setup-gradle@v4

      # 字体 26 MB，按 fetch-fonts.sh 的内容缓存，避免每次都从 GitHub 下载
      - uses: actions/cache@v4
        with:
          path: app/src/main/assets/fonts/*.ttf
          key: fonts-${{ hashFiles('scripts/fetch-fonts.sh') }}
      - run: scripts/fetch-fonts.sh

      # ubuntu-latest 自带 Android SDK（ANDROID_HOME 已设置），缺的平台由 AGP 自动下载
      - run: ./gradlew testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # 注意：CI 的 debug 密钥每次都不同，这个包不能覆盖安装本机构建的 debug 包
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
